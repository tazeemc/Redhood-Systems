<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedHood Terminal</title>
<meta name="description" content="RedHood Systems market terminal — price, narratives, regime and realised alpha in one keyboard-driven surface.">
<style>/* ===========================================================================
   RedHood Terminal — stylesheet
   Design system: RedHood brand (near-black surfaces, cream ink, red + gold)
   Chart colour slots are validated against the data-viz checks:
     categorical  #CE4A76 #7E6ADE #129A40 #0086D4 #D05228  (adjacent: pass)
     up / down    #2AA198 / #D83A3A  (CVD dE 12.5 — plus hollow/filled bodies)
     diverging    #D83A3A <- #6E6A64 -> #2AA198  (neutral grey midpoint)
     ordinal      amber ramp, min dL 0.097
   =========================================================================== */

:root {
  --bg: #0A0A0A;
  --panel: #111111;
  --panel-2: #161616;
  --raise: #1C1C1C;
  --wire: rgba(245, 240, 232, 0.09);
  --wire-2: rgba(245, 240, 232, 0.16);
  --ink: #F5F0E8;
  --ink-2: rgba(245, 240, 232, 0.62);
  --ink-3: rgba(245, 240, 232, 0.36);

  --brand: #C1121F;
  --brand-dim: #8B0D16;
  --gold: #B8975A;
  --gold-lo: #63502D;

  --up: #2AA198;
  --down: #D83A3A;
  --neutral: #6E6A64;

  --c1: #CE4A76; --c2: #7E6ADE; --c3: #129A40; --c4: #0086D4; --c5: #D05228;
  --g1: #F0D9A8; --g2: #D9B870; --g3: #B8975A; --g4: #8E7342; --g5: #63502D;

  --good: #2AA198; --warn: #D9B870; --serious: #D05228; --critical: #C1121F;

  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "Cascadia Mono",
          Menlo, Consolas, "Liberation Mono", monospace;
  --fs: 11.5px;
  --row: 20px;
  --gap: 1px;
  --radius: 2px;
}

:root[data-theme="light"] {
  --bg: #E8E3D8;
  --panel: #F7F3EA;
  --panel-2: #FFFDF7;
  --raise: #EFEADF;
  --wire: rgba(10, 10, 10, 0.12);
  --wire-2: rgba(10, 10, 10, 0.22);
  --ink: #16130F;
  --ink-2: rgba(22, 19, 15, 0.70);
  --ink-3: rgba(22, 19, 15, 0.45);
  --up: #008A5E; --down: #B3201F; --neutral: #6E6A64;
  --c1: #A32C56; --c2: #5542B8; --c3: #0D7430; --c4: #0062A3; --c5: #A33C18;
  --g1: #6B5730; --g2: #8E7342; --g3: #A9873F; --g4: #C4A86C; --g5: #DCC79A;
}

* { box-sizing: border-box; }

/* `hidden` must win over the display values set below (.overlay, .empty, …) */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: var(--fs)/1.35 var(--mono);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  display: grid;
  grid-template-rows: 30px 20px minmax(0, 1fr) 19px;
  gap: var(--gap);
}

button, input, select { font: inherit; color: inherit; font-variant-numeric: tabular-nums; }
h2, h3 { margin: 0; font-size: var(--fs); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
code { font: inherit; color: var(--gold); }
::selection { background: var(--brand); color: #fff; }

/* ───────────────────────────────── header ──────────────────────────────── */
#hdr {
  display: grid;
  grid-template-columns: auto minmax(260px, 1fr) auto auto;
  align-items: center;
  gap: 10px;
  padding: 0 8px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border-bottom: 1px solid var(--wire-2);
}

.brand { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.hood {
  width: 11px; height: 11px;
  background: var(--brand);
  clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%);
  box-shadow: 0 0 10px rgba(193, 18, 31, 0.55);
}
.bname { font-weight: 700; letter-spacing: 0.14em; font-size: 12px; }
.bname em { font-style: normal; color: var(--brand); }
.bsub { color: var(--ink-3); letter-spacing: 0.22em; font-size: 9px; }

.cmdwrap { position: relative; display: flex; align-items: center; gap: 0; }
.cmdlabel {
  background: var(--brand); color: #fff; padding: 2px 5px;
  font-size: 9px; letter-spacing: 0.14em; font-weight: 700;
  border-radius: var(--radius) 0 0 var(--radius);
}
#cmd {
  flex: 1; min-width: 0;
  background: var(--bg); border: 1px solid var(--wire-2); border-left: 0;
  padding: 2px 6px; height: 20px;
  text-transform: uppercase; letter-spacing: 0.04em; outline: none;
}
#cmd::placeholder { color: var(--ink-3); text-transform: none; letter-spacing: 0; }
#cmd:focus { border-color: var(--gold); box-shadow: inset 0 0 0 1px rgba(184, 151, 90, 0.35); }
.cmdhint {
  background: var(--raise); border: 1px solid var(--wire-2); border-left: 0;
  color: var(--ink-3); font-size: 9px; padding: 2px 5px; height: 20px;
  display: flex; align-items: center; border-radius: 0 var(--radius) var(--radius) 0;
}

.ac {
  position: absolute; top: 22px; left: 28px; right: 26px; z-index: 60;
  margin: 0; padding: 2px; list-style: none; max-height: 46vh; overflow: auto;
  background: var(--panel-2); border: 1px solid var(--gold);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
}
.ac li {
  display: grid; grid-template-columns: 62px 1fr auto;
  gap: 8px; padding: 2px 6px; cursor: pointer; white-space: nowrap;
}
.ac li .k { color: var(--gold); font-weight: 600; }
.ac li .d { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.ac li .r { color: var(--ink-3); font-size: 10px; }
.ac li[aria-selected="true"] { background: var(--brand-dim); }
.ac li[aria-selected="true"] .d, .ac li[aria-selected="true"] .r { color: var(--ink); }

.fnbar { display: flex; gap: 1px; }
.fnbar button {
  background: var(--raise); border: 1px solid transparent; color: var(--ink-2);
  padding: 2px 7px; height: 20px; cursor: pointer; letter-spacing: 0.08em; font-size: 10px;
}
.fnbar button:hover { color: var(--ink); border-color: var(--wire-2); }
.fnbar button.on { background: var(--brand); color: #fff; border-color: var(--brand); }

.hdrright { display: flex; align-items: center; gap: 6px; }
.chip {
  display: flex; align-items: center; gap: 5px;
  border: 1px solid var(--wire-2); padding: 1px 6px; height: 19px;
  font-size: 10px; letter-spacing: 0.06em; white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--neutral); }
.chip .lbl { font-weight: 600; }
.chip .num { color: var(--ink-2); }
.clock { color: var(--ink-2); font-size: 10px; white-space: nowrap; }
.iconbtn {
  background: none; border: 1px solid var(--wire-2); color: var(--ink-2);
  width: 20px; height: 19px; cursor: pointer; line-height: 1;
}
.iconbtn:hover { color: var(--ink); border-color: var(--gold); }

/* ──────────────────────────────── tape ─────────────────────────────────── */
.tape {
  overflow: hidden; background: var(--panel); border-bottom: 1px solid var(--wire);
  position: relative; mask-image: linear-gradient(90deg, transparent, #000 2%, #000 98%, transparent);
}
.tapetrack { display: flex; gap: 20px; align-items: center; height: 20px; width: max-content; animation: tapescroll 120s linear infinite; }
.tape:hover .tapetrack { animation-play-state: paused; }
@keyframes tapescroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.tapeitem { display: flex; gap: 5px; align-items: baseline; white-space: nowrap; cursor: pointer; font-size: 10.5px; }
.tapeitem:hover .ts { color: var(--gold); }
.tapeitem .ts { font-weight: 600; letter-spacing: 0.04em; }
.tapeitem .tp { color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { .tapetrack { animation: none; } }

/* ──────────────────────────────── grid ─────────────────────────────────── */
#grid {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr) 330px;
  grid-template-rows: minmax(0, 1fr) minmax(0, 300px);
  grid-template-areas: "monitor chart blotter" "monitor chart detail";
  gap: var(--gap);
  min-height: 0;
}
#p-monitor { grid-area: monitor; }
#p-chart   { grid-area: chart; }
#p-blotter { grid-area: blotter; }
#p-detail  { grid-area: detail; }

body.zoom #grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
body.zoom .panel { display: none; }
body.zoom .panel.zoomed { display: flex; grid-area: auto / 1 / auto / -1; }

.panel {
  background: var(--panel);
  border: 1px solid var(--wire);
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  outline: none;
}
.panel:focus-visible, .panel.focused { border-color: var(--gold); }

.phead {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 2px 6px; min-height: 22px;
  background: var(--panel-2); border-bottom: 1px solid var(--wire);
  /* never shrink below its own content: a squeezed header lets the chart's
     absolutely-positioned legend ride up over the controls */
  flex: none;
}
.phead h2 { color: var(--ink); }
.panel.focused .phead { background: linear-gradient(180deg, var(--raise), var(--panel-2)); }
.panel.focused .phead h2 { color: var(--gold); }
.pctl { display: flex; align-items: center; gap: 4px; }

.seg { display: flex; gap: 1px; }
.seg button {
  background: var(--raise); border: 1px solid transparent; color: var(--ink-3);
  padding: 1px 5px; height: 17px; cursor: pointer; font-size: 9.5px; letter-spacing: 0.06em;
}
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--gold-lo); border-color: var(--gold); color: var(--ink); }

.mini {
  background: var(--bg); border: 1px solid var(--wire-2); color: var(--ink);
  padding: 1px 4px; height: 17px; width: 78px; outline: none; font-size: 10px;
}
.mini:focus { border-color: var(--gold); }
select.mini { width: auto; }

.ptable { flex: 1; overflow: auto; min-height: 0; }
.pbody { flex: 1; overflow: auto; min-height: 0; padding: 6px 7px; }
.pfoot {
  border-top: 1px solid var(--wire); padding: 1px 6px;
  color: var(--ink-3); font-size: 9.5px; min-height: 16px; white-space: nowrap; overflow: hidden;
}

/* ──────────────────────────────── tables ───────────────────────────────── */
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--panel-2); border-bottom: 1px solid var(--wire-2);
  color: var(--ink-3); font-weight: 500; font-size: 9.5px; letter-spacing: 0.06em;
  text-transform: uppercase; text-align: right; padding: 2px 5px;
  cursor: pointer; user-select: none; white-space: nowrap;
}
thead th.l { text-align: left; }
thead th.nosort { cursor: default; }
thead th:hover:not(.nosort) { color: var(--ink); }
thead th[data-dir]::after { content: "▾"; margin-left: 3px; color: var(--gold); }
thead th[data-dir="asc"]::after { content: "▴"; }

tbody tr { border-bottom: 1px solid rgba(245, 240, 232, 0.035); cursor: pointer; height: var(--row); }
tbody tr:hover { background: var(--raise); }
tbody tr.sel { background: var(--brand-dim); }
tbody tr.sel td { color: var(--ink); }
tbody td { padding: 1px 5px; text-align: right; white-space: nowrap; }
/* `max-width:0` is what makes a cell ellipsis-truncate inside a fixed table —
   it must apply only to the free-text column, never to a label column. */
tbody td.l { text-align: left; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
tbody td.sym { font-weight: 600; letter-spacing: 0.03em; max-width: none; width: 1%; }
#montable th:first-child, #montable td.sym { width: 68px; }
#montable th:last-child, #montable td:last-child { width: 58px; }
#nartable th:first-child, #nartable td:first-child { width: 40px; max-width: none; }
#nartable th:nth-child(2), #nartable th:nth-child(3), #nartable th:nth-child(4) { width: 26px; }
tbody td.mut { color: var(--ink-3); }

.up { color: var(--up); }
.dn { color: var(--down); }
.flat { color: var(--ink-3); }

.spark { display: block; }

.badge {
  display: inline-block; padding: 0 3px; border-radius: var(--radius);
  font-size: 9px; font-weight: 600; letter-spacing: 0.04em; color: #0A0A0A;
}
.badge.wl { background: var(--gold); }
.badge.g-A, .badge.g-A- { background: var(--g1); }
.badge.g-B { background: var(--g2); }
.badge.g-C { background: var(--g3); }
.badge.g-D { background: var(--g4); }
.badge.g-F { background: var(--g5); color: var(--ink); }
.badge.na { background: var(--wire-2); color: var(--ink-2); }

.bar { height: 5px; background: var(--wire); position: relative; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--gold); display: block; }

/* ──────────────────────────────── chart ────────────────────────────────── */
.chartpanel { min-width: 0; }
.chead { flex-wrap: wrap; row-gap: 2px; }
.symblock { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.symblock h2 { font-size: 14px; letter-spacing: 0.06em; color: var(--ink); }
.symmeta { color: var(--ink-3); font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quote { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.quote .px { font-size: 14px; font-weight: 600; }
.quote .ch { font-size: 11px; }
.quote .sub { color: var(--ink-3); font-size: 9.5px; }
.chartctl { flex-wrap: wrap; row-gap: 2px; }

.chartbox { position: relative; flex: 1; min-height: 140px; overflow: hidden; }
#chart { display: block; width: 100%; height: 100%; cursor: crosshair; }
.legend {
  position: absolute; top: 4px; left: 6px; pointer-events: none;
  display: flex; flex-wrap: wrap; gap: 9px; font-size: 10px;
  text-shadow: 0 1px 3px var(--bg); max-width: calc(100% - 90px);
}
.legend .k { color: var(--ink-3); }
.legend .v { color: var(--ink); }
.legend .sw { display: inline-block; width: 7px; height: 2px; vertical-align: 2px; margin-right: 3px; }
.empty {
  position: absolute; inset: 0; display: grid; place-items: center;
  color: var(--ink-3); text-align: center; padding: 20px; font-size: 11px;
}

/* narrative-marker tooltip */
.xhair {
  position: absolute; top: 4px; right: 70px; z-index: 5; max-width: 320px;
  background: var(--panel-2); border: 1px solid var(--gold);
  border-left: 3px solid var(--brand);
  padding: 3px 7px; font-size: 10px; line-height: 1.4; color: var(--ink-2);
  pointer-events: none; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
}
.xhair b { color: var(--ink); font-weight: 600; }

/* ───────────────────────────── lower tabs ──────────────────────────────── */
.lower { display: flex; flex-direction: column; min-height: 0; flex: 0 0 40%; border-top: 1px solid var(--wire-2); }
.tabs { display: flex; flex: none; gap: 1px; background: var(--panel-2); border-bottom: 1px solid var(--wire); }
.tabs button {
  background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-3);
  padding: 2px 9px; height: 20px; cursor: pointer; letter-spacing: 0.08em;
  text-transform: uppercase; font-size: 9.5px;
}
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--gold); border-bottom-color: var(--brand); }
.tabbody { flex: 1; overflow: auto; min-height: 0; padding: 5px 7px; }

/* ─────────────────────────── panel content bits ────────────────────────── */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 9px; align-items: baseline; }
.kv dt { color: var(--ink-3); white-space: nowrap; }
.kv dd { margin: 0; color: var(--ink); }

.stats { display: flex; flex-wrap: wrap; gap: 1px; margin-bottom: 6px; }
.stat {
  background: var(--panel-2); border: 1px solid var(--wire); padding: 3px 7px; min-width: 76px;
}
.stat .sl { color: var(--ink-3); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; display: block; }
.stat .sv { font-size: 14px; font-weight: 600; line-height: 1.2; }
.stat .sn { color: var(--ink-3); font-size: 9px; }

.sect { margin: 0 0 7px; }
.sect > h4 {
  margin: 0 0 3px; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--gold); border-bottom: 1px solid var(--wire); padding-bottom: 2px; font-weight: 600;
}
.sect p { margin: 0 0 4px; color: var(--ink-2); }
.sect ul { margin: 0 0 4px; padding-left: 15px; color: var(--ink-2); }
.sect li { margin-bottom: 1px; }
.sect .bodytext { white-space: pre-wrap; color: var(--ink-2); font-size: 11px; }

.pillrow { display: flex; flex-wrap: wrap; gap: 3px; }
.pill {
  border: 1px solid var(--wire-2); padding: 0 5px; font-size: 9.5px;
  color: var(--ink-2); border-radius: 8px; cursor: pointer; white-space: nowrap;
}
.pill:hover { border-color: var(--gold); color: var(--ink); }
.pill.on { background: var(--gold-lo); border-color: var(--gold); color: var(--ink); }

.tapelist { display: flex; flex-direction: column; }
.tapeline {
  display: grid; grid-template-columns: 44px 94px 1fr; gap: 7px;
  padding: 2px 0; border-bottom: 1px solid rgba(245, 240, 232, 0.035); cursor: pointer;
}
.tapeline:hover { background: var(--raise); }
.tapeline .tt { color: var(--ink-3); font-size: 9.5px; }
.tapeline .tw { color: var(--gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tapeline .tx { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tapeline.rss .tw { color: var(--c4); }

/* Canvases carry their own pixel width, so the tracks are fixed rather than
   fractional — a 1fr track would stretch past the bitmap and leave a gap. */
.minichart { display: block; max-width: 100%; }
.chartrow { display: grid; gap: 7px; grid-template-columns: repeat(auto-fill, minmax(240px, 302px)); }
.chartcard {
  background: var(--panel-2); border: 1px solid var(--wire);
  padding: 4px 6px 2px; min-width: 0; overflow: hidden;
}
.chartcard > h4 {
  margin: 0 0 2px; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-2); font-weight: 500; display: flex; justify-content: space-between; gap: 6px;
}
.chartcard > h4 span { color: var(--ink-3); font-size: 9px; letter-spacing: 0; text-transform: none; }
.cleg { display: flex; flex-wrap: wrap; gap: 8px; font-size: 9px; color: var(--ink-3); padding: 1px 0 2px; }
.cleg i { display: inline-block; width: 7px; height: 2px; vertical-align: 2px; margin-right: 3px; }

.note { color: var(--ink-3); font-size: 9.5px; }
a { color: var(--c4); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ───────────────────────────── status bar ──────────────────────────────── */
#status {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 0 7px; background: var(--panel-2); border-top: 1px solid var(--wire-2);
  color: var(--ink-3); font-size: 9.5px; white-space: nowrap; overflow: hidden;
}
#status b { color: var(--ink-2); font-weight: 500; }
#status .k { color: var(--gold); }
#st-mid { overflow: hidden; text-overflow: ellipsis; }

/* ───────────────────────────── help overlay ───────────────────────────── */
.overlay {
  position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
  background: rgba(10, 10, 10, 0.78); backdrop-filter: blur(2px);
}
.helpcard {
  background: var(--panel); border: 1px solid var(--gold); padding: 12px 14px;
  width: min(760px, 92vw); max-height: 86vh; overflow: auto;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
}
.helphead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
.helphead h3 { color: var(--gold); letter-spacing: 0.14em; }
.helpgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px; }
.helpgrid section h4 {
  margin: 0 0 3px; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3); border-bottom: 1px solid var(--wire); padding-bottom: 2px;
}
.helpgrid dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; margin: 0; }
.helpgrid dt { color: var(--gold); white-space: nowrap; }
.helpgrid dd { margin: 0; color: var(--ink-2); }
.helpfoot { color: var(--ink-3); font-size: 9.5px; margin: 10px 0 0; border-top: 1px solid var(--wire); padding-top: 6px; }
kbd {
  background: var(--raise); border: 1px solid var(--wire-2); border-radius: var(--radius);
  padding: 0 3px; font: inherit; font-size: 9px; color: var(--ink-2);
}

.toast {
  position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 300;
  background: var(--panel-2); border: 1px solid var(--gold); color: var(--ink);
  padding: 4px 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); font-size: 11px;
}

/* ───────────────────────────── scrollbars ─────────────────────────────── */
* { scrollbar-width: thin; scrollbar-color: var(--wire-2) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--wire-2); }
::-webkit-scrollbar-thumb:hover { background: var(--gold-lo); }

/* ───────────────────────────── narrow screens ─────────────────────────── */
@media (max-width: 1180px) {
  #grid {
    grid-template-columns: 200px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr);
    grid-template-areas: "monitor chart" "blotter detail";
  }
}
@media (max-width: 820px) {

<script>/* ---- util.js ---- */
/* ===========================================================================
   util.js — formatting, DOM helpers, the data adapter, indicator maths.
   The adapter is the seam between STATIC (bundle baked in) and LIVE
   (bundle fetched from redhood_terminal.py --serve); nothing above it cares.
   =========================================================================== */
'use strict';

const RH = (window.RH = {});
const CFG = window.RH_CONFIG || { mode: 'static', api: '' };

/* ───────────────────────────── dom helpers ────────────────────────────── */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ───────────────────────────── formatting ─────────────────────────────── */
const EPOCH_MS = 86400000;

/** integer days-since-epoch -> Date (UTC midnight) */
const dayToDate = (d) => new Date(d * EPOCH_MS);
const dayToISO = (d) => new Date(d * EPOCH_MS).toISOString().slice(0, 10);
const isoToDay = (iso) => Math.floor(Date.parse(iso + 'T00:00:00Z') / EPOCH_MS);

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function fmtDay(d, style) {
  const t = dayToDate(d);
  const mon = MONTHS[t.getUTCMonth()];
  if (style === 'month') return `${mon} ${String(t.getUTCFullYear()).slice(2)}`;
  if (style === 'year') return String(t.getUTCFullYear());
  if (style === 'long') return `${t.getUTCDate()} ${mon} ${t.getUTCFullYear()}`;
  return `${mon} ${t.getUTCDate()}`;
}

/** price: keeps precision useful across BTC and penny names alike */
function fmtPx(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  const a = Math.abs(v);
  if (a >= 10000) return v.toLocaleString('en-US', { maximumFractionDigits: 0 });
  if (a >= 100) return v.toFixed(2);
  if (a >= 1) return v.toFixed(2);
  if (a >= 0.01) return v.toFixed(4);
  return v.toPrecision(3);
}

/** decimal fraction -> signed percent string */
function fmtPct(v, nd = 2) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  const s = (v * 100).toFixed(nd);
  return (v > 0 ? '+' : '') + s + '%';
}

function fmtNum(v, nd = 2) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  return Number(v).toFixed(nd);
}

function fmtVol(v) {
  if (!v) return '—';
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return String(v);
}

/** sign class for colour + the glyph that carries sign without colour */
const dirClass = (v) => (v === null || v === undefined || Number.isNaN(v) ? 'flat' : v > 0 ? 'up' : v < 0 ? 'dn' : 'flat');
const dirMark = (v) => (v === null || v === undefined || Number.isNaN(v) ? '' : v > 0 ? '▲' : v < 0 ? '▼' : '·');

function fmtAgo(iso) {
  if (!iso) return '—';
  const t = Date.parse(iso.endsWith('Z') || iso.includes('+') ? iso : iso + 'Z');
  if (Number.isNaN(t)) return iso.slice(0, 16).replace('T', ' ');
  const s = (Date.now() - t) / 1000;
  if (s < 90) return 'now';
  if (s < 5400) return Math.round(s / 60) + 'm';
  if (s < 172800) return Math.round(s / 3600) + 'h';
  return Math.round(s / 86400) + 'd';
}

const fmtStamp = (iso) => (iso || '').slice(0, 16).replace('T', ' ');

/* ──────────────────────────── theme palette ───────────────────────────── */
/** Live read of the CSS custom properties, so JS charts and CSS never drift. */
function palette() {
  const cs = getComputedStyle(document.documentElement);
  const g = (n) => cs.getPropertyValue(n).trim();
  return {
    ink: g('--ink'), ink2: g('--ink-2'), ink3: g('--ink-3'),
    wire: g('--wire'), wire2: g('--wire-2'),
    panel: g('--panel'), panel2: g('--panel-2'), bg: g('--bg'),
    brand: g('--brand'), gold: g('--gold'),
    up: g('--up'), down: g('--down'), neutral: g('--neutral'),
    cat: [g('--c1'), g('--c2'), g('--c3'), g('--c4'), g('--c5')],
    grade: [g('--g1'), g('--g2'), g('--g3'), g('--g4'), g('--g5')],
    status: { good: g('--good'), warn: g('--warn'), serious: g('--serious'), critical: g('--critical') },
  };
}

const REGIME_COLOR = (label, P) => ({
  TRENDING: P.status.good,
  CHOPPY: P.status.warn,
  TRANSITION: P.status.serious,
  CRISIS: P.status.critical,
}[String(label || '').toUpperCase()] || P.neutral);

/* ───────────────────────────── maths helpers ──────────────────────────── */
function sma(arr, n) {
  const out = new Array(arr.length).fill(null);
  let sum = 0, count = 0;
  for (let i = 0; i < arr.length; i++) {
    const v = arr[i];
    if (v !== null) { sum += v; count++; }
    if (i >= n) { const old = arr[i - n]; if (old !== null) { sum -= old; count--; } }
    if (i >= n - 1 && count === n) out[i] = sum / n;
  }
  return out;
}

function stdevBands(arr, n, k = 2) {
  const mid = sma(arr, n), up = [], lo = [];
  for (let i = 0; i < arr.length; i++) {
    if (mid[i] === null) { up.push(null); lo.push(null); continue; }
    let s = 0, c = 0;
    for (let j = i - n + 1; j <= i; j++) { if (arr[j] !== null) { s += (arr[j] - mid[i]) ** 2; c++; } }
    const sd = c ? Math.sqrt(s / c) : 0;
    up.push(mid[i] + k * sd); lo.push(mid[i] - k * sd);
  }
  return { mid, up, lo };
}

const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
function median(a) {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/** "nice" axis ticks: 1 / 2 / 2.5 / 5 x 10^n */
function niceTicks(min, max, target = 5) {
  if (!(isFinite(min) && isFinite(max)) || min === max) return [min];
  const raw = (max - min) / target;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 4 ? 2.5 : norm < 7 ? 5 : 10) * mag;
  const out = [];
  for (let t = Math.ceil(min / step) * step; t <= max + step * 0.001; t += step) out.push(+t.toFixed(10));
  return out;
}

/* ───────────────────────────── data adapter ───────────────────────────── */
/**
 * One interface over both shapes:
 *   static — window.RH_BUNDLE is baked into the page
 *   live   — GET {api}/bundle, and optional GET {api}/quotes?symbols=…
 */
const Source = {
  mode: CFG.mode || 'static',
  bundle: null,

  async load() {
    if (window.RH_BUNDLE) { this.bundle = window.RH_BUNDLE; this.mode = 'static'; return this.bundle; }
    const r = await fetch(`${CFG.api || '/api'}/bundle`, { headers: { accept: 'application/json' } });
    if (!r.ok) throw new Error(`bundle fetch failed: ${r.status} ${r.statusText}`);
    this.bundle = await r.json();
    this.mode = 'live';
    return this.bundle;
  },

  /** Polled quotes; resolves to {} in static mode so callers need no branch. */
  async quotes(symbols) {
    if (this.mode !== 'live' || !symbols || !symbols.length) return {};
    try {
      const r = await fetch(`${CFG.api || '/api'}/quotes?symbols=${encodeURIComponent(symbols.join(','))}`);
      if (!r.ok) return {};
      return (await r.json()).quotes || {};
    } catch { return {}; }
  },

  get live() { return this.mode === 'live'; },
};

/**
 * Series accessor. Decodes the wire format once per symbol and caches it:
 *   d0 + gap deltas -> absolute day numbers
 *   volume in thousands -> shares
 * Close-only symbols are normalised to the OHLC shape so the chart needs no
 * special case; hasOHLC says whether candles are meaningful.
 */
const _seriesCache = new Map();

function getSeries(ticker) {
  if (_seriesCache.has(ticker)) return _seriesCache.get(ticker);
  const s = Source.bundle?.series?.[ticker];
  if (!s) return null;

  const n = s.c.length;
  const d = new Int32Array(n);
  d[0] = s.d0;
  for (let i = 1; i < n; i++) d[i] = d[i - 1] + (s.d[i - 1] || 1);

  const out = {
    ticker, n, d,
    c: s.c,
    o: s.ohlc ? s.o : s.c,
    h: s.ohlc ? s.h : s.c,
    l: s.ohlc ? s.l : s.c,
    v: s.v ? s.v.map((k) => k * 1000) : null,
    hasOHLC: !!s.ohlc,
    hasVol: !!(s.v && s.v.some((k) => k > 0)),
  };
  _seriesCache.set(ticker, out);
  return out;
}

Object.assign(RH, {
  $, $$, el, esc, CFG, Source, getSeries, palette, REGIME_COLOR,
  dayToDate, dayToISO, isoToDay, fmtDay, fmtPx, fmtPct, fmtNum, fmtVol,
  fmtAgo, fmtStamp, dirClass, dirMark, sma, stdevBands, mean, median, niceTicks,
});

/* ---- chart.js ---- */
/* ===========================================================================
   chart.js — the price chart engine, plus the small multiples used by the
   lower panels. Canvas, hand-rolled, no dependencies: the page stays a single
   self-contained file that works offline and off a file:// URL.

   Direction is never carried by colour alone: up candles are hollow, down
   candles are filled, and every readout prints a signed number.
   =========================================================================== */
'use strict';

(function (RH) {
  const { el, fmtPx, fmtPct, fmtVol, fmtDay, dayToISO, sma, stdevBands,
          niceTicks, palette, getSeries } = RH;

  const PAD = { top: 4, right: 64, bottom: 18, left: 2 };
  const VOL_FRAC = 0.20;          // share of the plot height given to volume
  const MIN_BARS = 12;
  const MA_SPECS = [[20, 0], [50, 1], [200, 3]];   // [period, categorical slot]

  class Chart {
    constructor(canvas, box) {
      this.cv = canvas;
      this.box = box;
      this.ctx = canvas.getContext('2d');
      this.series = null;
      this.bench = null;                 // SPY series, for relative mode
      this.pins = [];                    // narrative markers
      this.i0 = 0; this.i1 = 0;          // visible index window
      this.hover = null;                 // hovered index
      this.hoverPin = null;
      this.style = 'candle';
      this.opts = { ma: true, bb: false, vol: true, pins: true, log: false, rel: false };
      this.onPinClick = null;
      this.onHover = null;
      this._drag = null;
      this._raf = null;

      this._bind();
      this._measure();
      this._ro = new ResizeObserver(() => this.resize());
      this._ro.observe(box);
    }

    /* ─────────────────────────── data & view ─────────────────────────── */
    setSeries(series, { pins = [], bench = null, keepView = false } = {}) {
      const prevSpan = this.i1 - this.i0;
      this.series = series;
      this.pins = pins;
      this.bench = bench;
      if (!series) return this.draw();
      if (keepView && prevSpan > 0) {
        this.i1 = series.n - 1;
        this.i0 = Math.max(0, this.i1 - prevSpan);
      } else {
        this.setRange(252);
      }
      this.resize();        // synchronous: a new symbol always lands on screen
    }

    /** bars = number of trailing bars, 0 = all, 'ytd' = since Jan 1 */
    setRange(bars) {
      const s = this.series;
      if (!s) return;
      this.i1 = s.n - 1;
      if (bars === 'ytd') {
        const y = new Date(s.d[s.n - 1] * 86400000).getUTCFullYear();
        const jan1 = Math.floor(Date.parse(`${y}-01-01T00:00:00Z`) / 86400000);
        let i = s.d.findIndex((d) => d >= jan1);
        if (i < 0) i = 0;
        this.i0 = Math.max(0, i - 1);
      } else if (!bars || bars <= 0) {
        this.i0 = 0;
      } else {
        this.i0 = Math.max(0, this.i1 - bars + 1);
      }
      if (this.i1 - this.i0 < MIN_BARS) this.i0 = Math.max(0, this.i1 - MIN_BARS);
      this.draw();
    }

    set(opt, val) {
      if (opt === 'style') this.style = val;
      else this.opts[opt] = val;
      // Synchronous: callers read back _data for the legend on the next line,
      // and a deferred frame would hand them the previous mode's numbers.
      this.redraw();
    }

    /** Draw now, cancelling any frame already queued. */
    redraw() {
      if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }
      this._draw();
    }

    pan(bars) {
      const s = this.series; if (!s) return;
      const span = this.i1 - this.i0;
      let i0 = this.i0 + bars, i1 = this.i1 + bars;
      if (i0 < 0) { i0 = 0; i1 = span; }
      if (i1 > s.n - 1) { i1 = s.n - 1; i0 = i1 - span; }
      this.i0 = Math.max(0, i0); this.i1 = i1;
      this.draw();
    }

    zoom(factor, anchorIdx) {
      const s = this.series; if (!s) return;
      const span = this.i1 - this.i0;
      const next = Math.max(MIN_BARS, Math.min(s.n - 1, Math.round(span * factor)));
      const a = anchorIdx ?? (this.i0 + span / 2);
      const frac = span > 0 ? (a - this.i0) / span : 0.5;
      let i0 = Math.round(a - frac * next);
      let i1 = i0 + next;
      if (i0 < 0) { i0 = 0; i1 = next; }
      if (i1 > s.n - 1) { i1 = s.n - 1; i0 = Math.max(0, i1 - next); }
      this.i0 = i0; this.i1 = i1;
      this.draw();
    }

    /* ─────────────────────────── geometry ───────────────────────────── */
    /** Measure only. Separated from resize() so the first paint never has to
        wait on requestAnimationFrame, which a hidden or throttled tab
        may not run at all. */
    _measure() {
      const r = this.box.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      this.w = Math.max(80, Math.round(r.width));
      this.h = Math.max(80, Math.round(r.height));
      this.cv.width = Math.round(this.w * dpr);
      this.cv.height = Math.round(this.h * dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    resize() {
      this._measure();
      this.redraw();
    }

    get plot() {
      const showVol = this.opts.vol && this.series?.hasVol && !this.opts.rel;
      const x0 = PAD.left, x1 = this.w - PAD.right;
      const yTop = PAD.top, yBot = this.h - PAD.bottom;
      const volH = showVol ? Math.max(18, (yBot - yTop) * VOL_FRAC) : 0;
      return { x0, x1, yTop, yBot, priceBot: yBot - volH - (showVol ? 6 : 0), volTop: yBot - volH, volH, showVol };
    }

    /** index -> x centre */
    xOf(i) {
      const { x0, x1 } = this.plot;
      const n = this.i1 - this.i0 + 1;
      const bw = (x1 - x0) / n;
      return x0 + (i - this.i0 + 0.5) * bw;
    }

    xToIndex(px) {
      const { x0, x1 } = this.plot;
      const n = this.i1 - this.i0 + 1;
      const bw = (x1 - x0) / n;
      return Math.max(this.i0, Math.min(this.i1, Math.round(this.i0 + (px - x0) / bw - 0.5)));
    }

    /** value -> y, honouring the log toggle */
    yOf(v) {
      const p = this.plot, { lo, hi } = this._scale;
      if (v === null || v === undefined || Number.isNaN(v)) return null;
      const t = this.opts.log
        ? (Math.log(Math.max(v, 1e-9)) - Math.log(Math.max(lo, 1e-9))) / (Math.log(Math.max(hi, 1e-9)) - Math.log(Math.max(lo, 1e-9)))
        : (v - lo) / (hi - lo);
      return p.priceBot - t * (p.priceBot - p.yTop);
    }

    yToValue(py) {
      const p = this.plot, { lo, hi } = this._scale;
      const t = (p.priceBot - py) / (p.priceBot - p.yTop);
      return this.opts.log
        ? Math.exp(Math.log(Math.max(lo, 1e-9)) + t * (Math.log(Math.max(hi, 1e-9)) - Math.log(Math.max(lo, 1e-9))))
        : lo + t * (hi - lo);
    }

    /** The plotted arrays for the current mode (absolute price or vs-SPY). */
    _plotted() {
      const s = this.series;
      if (!this.opts.rel || !this.bench) {
        return { o: s.o, h: s.h, l: s.l, c: s.c, candles: s.hasOHLC && this.style === 'candle' };
      }
      // Relative mode: both legs indexed to 0% at the left edge of the view.
      const byDay = new Map();
      for (let i = 0; i < this.bench.n; i++) byDay.set(this.bench.d[i], this.bench.c[i]);
      /** Latest benchmark close on or before `day`. Bench days are ascending. */
      const benchAt = (day) => {
        for (let i = this.bench.n - 1; i >= 0; i--) {
          if (this.bench.d[i] <= day && this.bench.c[i]) return this.bench.c[i];
        }
        return null;
      };
      const base = s.c[this.i0];
      // The benchmark does not necessarily trade on this symbol's left-edge
      // day - BTC-USD runs through weekends, a .TO listing trades on US
      // holidays. An exact-day baseline would then be null and null every
      // plotted point, blanking the whole chart, so fall back to the most
      // recent benchmark bar at or before that day.
      const bBase = benchAt(s.d[this.i0]);
      const c = s.c.map((v, i) => {
        const b = byDay.get(s.d[i]);
        if (!v || !base || !b || !bBase) return null;
        return (v / base) / (b / bBase) - 1;
      });
      return { o: c, h: c, l: c, c, candles: false, rel: true };
    }

    _computeScale(P) {
      const s = this.series, d = this._plotted();
      let lo = Infinity, hi = -Infinity;
      for (let i = this.i0; i <= this.i1; i++) {
        // Same close-only fallback the candle loop uses, so a bar missing its
        // high/low still pulls the scale around the price that gets drawn.
        const c = d.c[i], h = d.h[i] ?? c, l = d.l[i] ?? c;
        if (h !== null && h > hi) hi = h;
        if (l !== null && l < lo) lo = l;
      }
      if (this.opts.ma && !d.rel) {
        for (const [n] of MA_SPECS) {
          const m = this._ma(n);
          for (let i = this.i0; i <= this.i1; i++) {
            if (m[i] === null) continue;
            if (m[i] > hi) hi = m[i];
            if (m[i] < lo) lo = m[i];
          }
        }
      }
      if (this.opts.bb && !d.rel) {
        const b = this._bb();
        for (let i = this.i0; i <= this.i1; i++) {
          if (b.up[i] !== null && b.up[i] > hi) hi = b.up[i];
          if (b.lo[i] !== null && b.lo[i] < lo) lo = b.lo[i];
        }
      }
      if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
      if (lo === hi) { lo -= 1; hi += 1; }
      const padv = (hi - lo) * 0.06;
      this._scale = { lo: d.rel ? lo - padv : Math.max(lo - padv, this.opts.log ? 1e-6 : -Infinity), hi: hi + padv };
      this._data = d;

      let vmax = 0;
      if (this.plot.showVol && s.v) {
        for (let i = this.i0; i <= this.i1; i++) vmax = Math.max(vmax, s.v[i] || 0);
      }
      this._vmax = vmax || 1;
    }

    _ma(n) {
      this._maCache = this._maCache || {};
      const key = `${this.series.ticker}:${n}`;
      if (!this._maCache[key]) this._maCache[key] = sma(this.series.c, n);
      return this._maCache[key];
    }

    _bb() {
      const key = `${this.series.ticker}:bb`;
      this._bbCache = this._bbCache || {};
      if (!this._bbCache[key]) this._bbCache[key] = stdevBands(this.series.c, 20, 2);
      return this._bbCache[key];
    }

    /* ───────────────────────────── drawing ─────────────────────────── */
    draw() {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = null; this._draw(); });
    }

    _draw() {
      const ctx = this.ctx;
      if (!this.w) this._measure();
      const P = palette();
      ctx.clearRect(0, 0, this.w, this.h);
      ctx.fillStyle = P.panel;
      ctx.fillRect(0, 0, this.w, this.h);

      if (!this.series || !this.series.n) return;
      if (this.i1 <= this.i0) this.setRange(252);
      this._computeScale(P);

      this._grid(P);
      if (this.opts.bb && !this._data.rel) this._bands(P);
      if (this._data.candles) this._candles(P); else this._line(P);
      if (this.opts.ma && !this._data.rel) this._mas(P);
      if (this.plot.showVol) this._volume(P);
      if (this.opts.pins) this._pins(P);
      this._axes(P);
      this._crosshair(P);
    }

    _grid(P) {
      const ctx = this.ctx, p = this.plot;
      ctx.save();
      ctx.strokeStyle = P.wire;
      ctx.lineWidth = 1;
      for (const t of niceTicks(this._scale.lo, this._scale.hi, 5)) {
        const y = Math.round(this.yOf(t)) + 0.5;
        if (y < p.yTop || y > p.priceBot) continue;
        ctx.beginPath(); ctx.moveTo(p.x0, y); ctx.lineTo(p.x1, y); ctx.stroke();
      }
      for (const { i } of this._timeTicks()) {
        const x = Math.round(this.xOf(i)) + 0.5;
        ctx.beginPath(); ctx.moveTo(x, p.yTop); ctx.lineTo(x, p.yBot); ctx.stroke();
      }
      if (this._data.rel) {                           // zero line in relative mode
        const y = this.yOf(0);
        if (y !== null && y > p.yTop && y < p.priceBot) {
          ctx.strokeStyle = P.wire2;
          ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.moveTo(p.x0, y); ctx.lineTo(p.x1, y); ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      ctx.restore();
    }

    _candles(P) {
      const ctx = this.ctx, d = this._data, s = this.series;
      const n = this.i1 - this.i0 + 1;
      const bw = (this.plot.x1 - this.plot.x0) / n;
      const body = Math.max(1, Math.min(bw * 0.68, 14));
      const thin = bw < 3.2;
      ctx.save();
      ctx.lineWidth = 1;
      for (let i = this.i0; i <= this.i1; i++) {
        const c = d.c[i];
        if (c === null) continue;
        // A series is marked ohlc=1 once over half its bars have an open, so
        // individual bars can still be close-only. Falling back to the close
        // keeps those drawn as a flat mark; without it null reaches yOf() as 0
        // and the bar paints a wick across the whole plot.
        const o = d.o[i] ?? c, h = d.h[i] ?? c, l = d.l[i] ?? c;
        const up = c >= o;
        const col = up ? P.up : P.down;
        const x = Math.round(this.xOf(i)) + 0.5;
        const yH = this.yOf(h), yL = this.yOf(l), yO = this.yOf(o), yC = this.yOf(c);

        ctx.strokeStyle = col;
        ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();   // wick

        if (thin) continue;
        const top = Math.min(yO, yC), bot = Math.max(yO, yC);
        const hgt = Math.max(1, bot - top);
        const bx = Math.round(x - body / 2);
        // Hollow body = up, filled = down: direction without relying on hue.
        if (up) {
          ctx.fillStyle = P.panel;
          ctx.fillRect(bx, top, Math.round(body), hgt);
          ctx.strokeStyle = col;
          ctx.strokeRect(bx + 0.5, Math.round(top) + 0.5, Math.round(body) - 1, Math.max(1, Math.round(hgt) - 1));
        } else {
          ctx.fillStyle = col;
          ctx.fillRect(bx, top, Math.round(body), hgt);
        }
      }
      ctx.restore();
    }

    _line(P) {
      const ctx = this.ctx, d = this._data, p = this.plot;
      const last = d.c[this.i1], first = d.c[this.i0];
      const rising = (last ?? 0) >= (first ?? 0);
      const col = d.rel ? (rising ? P.up : P.down) : P.gold;

      ctx.save();
      // area fill, then the 2px stroke on top
      const grad = ctx.createLinearGradient(0, p.yTop, 0, p.priceBot);
      grad.addColorStop(0, col + '33');
      grad.addColorStop(1, col + '00');
      ctx.beginPath();
      let started = false, firstX = null;
      for (let i = this.i0; i <= this.i1; i++) {
        const v = d.c[i]; if (v === null) continue;
        const x = this.xOf(i), y = this.yOf(v);
        if (!started) { ctx.moveTo(x, y); started = true; firstX = x; } else ctx.lineTo(x, y);
      }
      if (started) {
        const lastX = this.xOf(this.i1);
        ctx.lineTo(lastX, p.priceBot); ctx.lineTo(firstX, p.priceBot); ctx.closePath();
        ctx.fillStyle = grad; ctx.fill();
      }
      ctx.beginPath();
      started = false;
      for (let i = this.i0; i <= this.i1; i++) {
        const v = d.c[i]; if (v === null) continue;
        const x = this.xOf(i), y = this.yOf(v);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.restore();
    }

    _mas(P) {
      const ctx = this.ctx;
      ctx.save(); ctx.lineWidth = 1.25;
      for (const [n, slot] of MA_SPECS) {
        const m = this._ma(n);
        ctx.strokeStyle = P.cat[slot];
        ctx.beginPath();
        let started = false;
        for (let i = this.i0; i <= this.i1; i++) {
          if (m[i] === null) { started = false; continue; }
          const x = this.xOf(i), y = this.yOf(m[i]);
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    _bands(P) {
      const b = this._bb(), ctx = this.ctx;
      ctx.save();
      ctx.fillStyle = P.wire;
      ctx.beginPath();
      let started = false;
      for (let i = this.i0; i <= this.i1; i++) {
        if (b.up[i] === null) continue;
        const x = this.xOf(i), y = this.yOf(b.up[i]);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      for (let i = this.i1; i >= this.i0; i--) {
        if (b.lo[i] === null) continue;
        ctx.lineTo(this.xOf(i), this.yOf(b.lo[i]));
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = P.ink3; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
      for (const key of ['up', 'lo']) {
        ctx.beginPath(); started = false;
        for (let i = this.i0; i <= this.i1; i++) {
          if (b[key][i] === null) continue;
          const x = this.xOf(i), y = this.yOf(b[key][i]);
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.restore();
    }

    _volume(P) {
      const ctx = this.ctx, p = this.plot, s = this.series, d = this._data;
      const n = this.i1 - this.i0 + 1;
      const bw = (p.x1 - p.x0) / n;
      const w = Math.max(1, Math.min(bw * 0.68, 14));
      ctx.save();
      for (let i = this.i0; i <= this.i1; i++) {
        const v = s.v[i]; if (!v) continue;
        const up = d.c[i] >= (d.o[i] ?? d.c[i]);
        const hgt = (v / this._vmax) * (p.volH - 2);
        ctx.fillStyle = (up ? P.up : P.down) + '66';
        ctx.fillRect(Math.round(this.xOf(i) - w / 2), p.yBot - hgt, Math.round(w), hgt);
      }
      ctx.strokeStyle = P.wire;
      ctx.beginPath(); ctx.moveTo(p.x0, p.volTop - 3.5); ctx.lineTo(p.x1, p.volTop - 3.5); ctx.stroke();
      ctx.restore();
    }

    /** Narrative markers: where the system actually had a thesis on this name. */
    _pins(P) {
      if (!this.pins.length) return;
      const ctx = this.ctx, p = this.plot;
      const d0 = this.series.d[this.i0], d1 = this.series.d[this.i1];
      this._pinHits = [];
      ctx.save();
      for (const pin of this.pins) {
        if (pin.day < d0 || pin.day > d1) continue;
        let i = this._indexForDay(pin.day);
        if (i === null) continue;
        const x = this.xOf(i);
        const y = p.priceBot - 2;
        const col = pin.color || P.gold;
        ctx.beginPath();
        ctx.moveTo(x, y - 8); ctx.lineTo(x - 4.2, y); ctx.lineTo(x + 4.2, y);
        ctx.closePath();
        ctx.fillStyle = col; ctx.fill();
        ctx.strokeStyle = P.panel; ctx.lineWidth = 1; ctx.stroke();
        ctx.strokeStyle = col + '55';
        ctx.setLineDash([2, 4]);
        ctx.beginPath(); ctx.moveTo(x, p.yTop); ctx.lineTo(x, y - 8); ctx.stroke();
        ctx.setLineDash([]);
        this._pinHits.push({ x, y, pin });
      }
      ctx.restore();
    }

    _indexForDay(day) {
      const d = this.series.d;
      let lo = 0, hi = d.length - 1, best = null;
      while (lo <= hi) {
        const m = (lo + hi) >> 1;
        if (d[m] === day) return m;
        if (d[m] < day) { best = m; lo = m + 1; } else hi = m - 1;
      }
      return best;
    }

    _timeTicks() {
      const s = this.series, out = [];
      const n = this.i1 - this.i0 + 1;
      const target = Math.max(2, Math.min(9, Math.floor((this.plot.x1 - this.plot.x0) / 78)));
      const step = Math.max(1, Math.floor(n / target));
      let lastLabel = '';
      for (let i = this.i0; i <= this.i1; i += step) {
        const style = n > 400 ? 'month' : n > 90 ? 'month' : 'day';
        const label = fmtDay(s.d[i], style);
        if (label === lastLabel) continue;
        lastLabel = label;
        out.push({ i, label });
      }
      return out;
    }

    _axes(P) {
      const ctx = this.ctx, p = this.plot;
      ctx.save();
      ctx.font = '9.5px var(--mono, monospace)';
      ctx.fillStyle = P.ink3;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const rel = this._data.rel;
      for (const t of niceTicks(this._scale.lo, this._scale.hi, 5)) {
        const y = this.yOf(t);
        if (y < p.yTop || y > p.priceBot) continue;
        ctx.fillText(rel ? fmtPct(t, 1) : fmtPx(t), p.x1 + 5, y);
      }
      if (p.showVol) {
        ctx.fillText(fmtVol(this._vmax), p.x1 + 5, p.volTop + 5);
      }
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      for (const { i, label } of this._timeTicks()) {
        ctx.fillText(label, this.xOf(i), p.yBot + 4);
      }
      ctx.restore();
      this._lastTag(P);
    }

    _lastTag(P) {
      const ctx = this.ctx, p = this.plot, d = this._data;
      const v = d.c[this.i1];
      if (v === null || v === undefined) return;
      const y = this.yOf(v);
      if (y === null || y < p.yTop || y > p.priceBot) return;
      const txt = d.rel ? fmtPct(v, 1) : fmtPx(v);
      const up = d.c[this.i1] >= (d.o[this.i1] ?? d.c[this.i1]);
      ctx.save();
      ctx.font = '10px var(--mono, monospace)';
      const w = Math.max(ctx.measureText(txt).width + 8, 44);
      ctx.fillStyle = up ? P.up : P.down;
      ctx.fillRect(p.x1 + 1, y - 7, w, 14);
      ctx.strokeStyle = P.wire2;
      ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(p.x0, y + 0.5); ctx.lineTo(p.x1, y + 0.5); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#0A0A0A';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(txt, p.x1 + 5, y);
      ctx.restore();
    }

    _crosshair(P) {
      const i = this.hover;
      if (i === null || i === undefined) return;
      const ctx = this.ctx, p = this.plot, d = this._data;
      const x = Math.round(this.xOf(i)) + 0.5;
      ctx.save();
      ctx.strokeStyle = P.ink3;
      ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(x, p.yTop); ctx.lineTo(x, p.yBot); ctx.stroke();
      if (this._mouseY !== null && this._mouseY > p.yTop && this._mouseY < p.priceBot) {
        const y = Math.round(this._mouseY) + 0.5;
        ctx.beginPath(); ctx.moveTo(p.x0, y); ctx.lineTo(p.x1, y); ctx.stroke();
        ctx.setLineDash([]);
        const v = this.yToValue(this._mouseY);
        const txt = d.rel ? fmtPct(v, 1) : fmtPx(v);
        ctx.font = '10px var(--mono, monospace)';
        const w = Math.max(ctx.measureText(txt).width + 8, 44);
        ctx.fillStyle = P.ink;
        ctx.fillRect(p.x1 + 1, y - 7, w, 14);
        ctx.fillStyle = P.bg;
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(txt, p.x1 + 5, y);
      }
      ctx.setLineDash([]);
      // date tag on the time axis
      const label = fmtDay(this.series.d[i], 'long');
      ctx.font = '9.5px var(--mono, monospace)';
      const tw = ctx.measureText(label).width + 10;
      ctx.fillStyle = P.ink;
      ctx.fillRect(Math.min(Math.max(x - tw / 2, p.x0), p.x1 - tw), p.yBot + 1, tw, 14);
      ctx.fillStyle = P.bg;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(label, Math.min(Math.max(x, p.x0 + tw / 2), p.x1 - tw / 2), p.yBot + 3);
      ctx.restore();
    }

    /* ───────────────────────── interaction ─────────────────────────── */
    _bind() {
      const cv = this.cv;

      cv.addEventListener('mousemove', (e) => {
        const r = cv.getBoundingClientRect();
        const mx = e.clientX - r.left, my = e.clientY - r.top;
        this._mouseY = my;
        if (this._drag) {
          const n = this.i1 - this.i0 + 1;
          const bw = (this.plot.x1 - this.plot.x0) / n;
          const shift = Math.round((this._drag.x - mx) / bw);
          if (shift !== 0) {
            this.i0 = this._drag.i0 + shift; this.i1 = this._drag.i1 + shift;
            const s = this.series;
            if (this.i0 < 0) { this.i1 -= this.i0; this.i0 = 0; }
            if (this.i1 > s.n - 1) { this.i0 -= this.i1 - (s.n - 1); this.i1 = s.n - 1; }
            this.i0 = Math.max(0, this.i0);
          }
        }
        this.hover = this.series ? this.xToIndex(mx) : null;
        this.hoverPin = this._pinAt(mx, my);
        cv.style.cursor = this.hoverPin ? 'pointer' : this._drag ? 'grabbing' : 'crosshair';
        if (this.onHover) this.onHover(this.hover, this.hoverPin);
        this.draw();
      });

      cv.addEventListener('mouseleave', () => {
        this.hover = null; this.hoverPin = null; this._mouseY = null;
        if (this.onHover) this.onHover(null, null);
        this.draw();
      });

      cv.addEventListener('mousedown', (e) => {
        const r = cv.getBoundingClientRect();
        const mx = e.clientX - r.left, my = e.clientY - r.top;
        const pin = this._pinAt(mx, my);
        if (pin && this.onPinClick) { this.onPinClick(pin.pin); return; }
        this._drag = { x: mx, i0: this.i0, i1: this.i1 };
        cv.style.cursor = 'grabbing';
      });

      window.addEventListener('mouseup', () => { this._drag = null; });

      cv.addEventListener('wheel', (e) => {
        if (!this.series) return;
        e.preventDefault();
        const r = cv.getBoundingClientRect();
        const anchor = this.xToIndex(e.clientX - r.left);
        this.zoom(e.deltaY > 0 ? 1.18 : 1 / 1.18, anchor);
      }, { passive: false });

      cv.addEventListener('dblclick', () => this.setRange(252));
    }

    _pinAt(mx, my) {
      for (const hit of this._pinHits || []) {
        if (Math.abs(hit.x - mx) <= 6 && Math.abs(hit.y - 4 - my) <= 9) return hit;
      }
      return null;
    }

    /** Readout for the legend: OHLC + volume + change at the hovered bar. */
    readout(i) {
      const s = this.series; if (!s) return null;
      const idx = i ?? this.i1;
      const d = this._data || { o: s.o, h: s.h, l: s.l, c: s.c };
      const prev = idx > 0 ? d.c[idx - 1] : null;
      const c = d.c[idx];
      return {
        i: idx, day: s.d[idx], iso: dayToISO(s.d[idx]),
        o: d.o[idx], h: d.h[idx], l: d.l[idx], c,
        v: s.v ? s.v[idx] : null,
        chg: prev && c !== null ? c / prev - 1 : null,
        rel: !!d.rel,
      };
    }
  }

      ctx.strokeStyle = P.wire; ctx.lineWidth = 1;

    if (zero) {
      const y = Math.round(Y(0)) + 0.5;
      ctx.strokeStyle = P.wire2; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();

    for (const s of series) {
      const p = s.points.filter((q) => q && q.y !== null && isFinite(q.y));

      ctx.beginPath();
      p.forEach((q, i) => (i ? ctx.lineTo(X(q.x), Y(q.y)) : ctx.moveTo(X(q.x), Y(q.y))));
      ctx.strokeStyle = s.color || P.gold;

      ctx.textAlign = 'right'; ctx.fillText(xFmt(xhi), w - pad.r, h - pad.b + 3);
    }
    return cv;
  }

  /**
   * Horizontal bar card with a diverging scale around zero.
   * rows: [{label, value, note}] — value is a decimal fraction.
   */
  function barCard(rows, { w = 300, rowH = 15, fmt = (v) => fmtPct(v, 1), zero = true } = {}) {
    const h = Math.max(rowH, rows.length * rowH) + 4;
    const cv = document.createElement('canvas');
    cv.className = 'minichart';
    const ctx = hidpi(cv, w, h);
    const P = palette();
    const labelW = 62, valW = 52;
    const plotW = w - labelW - valW;
    const vals = rows.map((r) => r.value).filter((v) => v !== null && isFinite(v));
    if (!vals.length) return cv;
    const amax = Math.max(...vals.map(Math.abs)) || 1;
    const mid = zero ? labelW + plotW / 2 : labelW;
    const scale = zero ? (plotW / 2) / amax : plotW / amax;

    ctx.font = '9.5px var(--mono, monospace)';
    ctx.textBaseline = 'middle';
    rows.forEach((r, i) => {
      const y = 2 + i * rowH + rowH / 2;
      ctx.fillStyle = P.ink2; ctx.textAlign = 'left';
      ctx.fillText(String(r.label).slice(0, 9), 1, y);
      if (r.value === null || !isFinite(r.value)) {
        ctx.fillStyle = P.ink3; ctx.textAlign = 'right';
        ctx.fillText('—', w - 2, y);
        return;
      }
      const len = Math.abs(r.value) * scale;
      const x = r.value >= 0 ? mid : mid - len;
      // 4px rounded data-end, anchored to the zero baseline
      const bh = Math.min(8, rowH - 5);
      ctx.fillStyle = r.value >= 0 ? P.up : P.down;
      const rad = Math.min(4, len);
      ctx.beginPath();
      if (r.value >= 0) {
        ctx.moveTo(x, y - bh / 2); ctx.lineTo(x + Math.max(0, len - rad), y - bh / 2);
        ctx.quadraticCurveTo(x + len, y - bh / 2, x + len, y);
        ctx.quadraticCurveTo(x + len, y + bh / 2, x + Math.max(0, len - rad), y + bh / 2);
        ctx.lineTo(x, y + bh / 2);
      } else {
        ctx.moveTo(mid, y - bh / 2); ctx.lineTo(x + rad, y - bh / 2);
        ctx.quadraticCurveTo(x, y - bh / 2, x, y);
        ctx.quadraticCurveTo(x, y + bh / 2, x + rad, y + bh / 2);
        ctx.lineTo(mid, y + bh / 2);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = P.ink; ctx.textAlign = 'right';
      ctx.fillText(fmt(r.value), w - 2, y);
      if (r.note) {

    const padv = (yhi - ylo) * 0.08; ylo -= padv; yhi += padv;
    const X = (v) => pad.l + ((v - xlo) / (xhi - xlo)) * (w - pad.l - pad.r);

    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

  }
